name: Build x86 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-x86:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GN
        run: |
          wget -q https://chrome-infra-packages.appspot.com/dl/gn/gn/linux-amd64/+/latest -O gn.zip
          unzip -q gn.zip -d gn_bin
          sudo install -m 0755 gn_bin/gn /usr/local/bin/gn

      - name: Install build dependencies
        run: |
          unset ANDROID_SDK_ROOT
          echo "ANDROID_SDK_ROOT=" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -qqy --no-install-recommends \
            bison clang libasound2-dev libgles2-mesa-dev libglib2.0-dev \
            libxcomposite-dev libxi-dev libxrender-dev nasm ninja-build \
            python3-venv ccache gcc-multilib g++-multilib libc6-dev-i386
          bash ./starboard/tools/download_clang.sh
          bash ./starboard/android/shared/download_sdk.sh

      - name: Generate x86 build
        run: |
          gn gen out/android-x86_gold --args='target_platform="android-x86" target_os="android" target_cpu="x86" build_type="gold" sb_api_version=15'

      - name: Build x86 APK
        run: ninja -C out/android-x86_gold cobalt_install

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          apk=$(find out/android-x86_gold -type f -name '*.apk' | head -n 1)
          test -n "$apk"
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          unzip -l "$apk" | grep 'lib/x86/'

      - name: Upload x86 APK
        uses: actions/upload-artifact@v4
        with:
          name: TizenTubeCobalt-x86
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 7
