name: android_release

on:
  push:

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
    strategy:
      matrix:
        include:
          - arch: arm64
            cpu: arm64
          - arch: x86
            cpu: x86
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GN
        run: |
          wget https://chrome-infra-packages.appspot.com/dl/gn/gn/linux-amd64/+/latest -O gn.zip
          unzip gn.zip -d gn_bin
          sudo mv gn_bin/gn /usr/local/bin/gn
          sudo chmod +x /usr/local/bin/gn

      - name: Install build dependencies
        run: |
          # Unset system SDK root to prevent permission issues
          unset ANDROID_SDK_ROOT
          echo "ANDROID_SDK_ROOT=" >> $GITHUB_ENV
          
          sudo apt update && sudo apt install -qqy --no-install-recommends \
            bison clang libasound2-dev libgles2-mesa-dev libglib2.0-dev \
            libxcomposite-dev libxi-dev libxrender-dev nasm ninja-build \
            python3-venv ccache gcc-multilib \
            g++-multilib libc6-dev-i386
          ccache --max-size=20G
          bash ./starboard/tools/download_clang.sh
          bash ./starboard/android/shared/download_sdk.sh

      - name: GN
        run: |
          export PYTHONPATH=$GITHUB_WORKSPACE:$PYTHONPATH
          gn gen out/android-${{ matrix.arch }}_gold --args='target_platform="android-${{ matrix.arch }}" target_os="android" target_cpu="${{ matrix.cpu }}" build_type="gold" sb_api_version=15'
          gn check out/android-${{ matrix.arch }}_gold

      - name: Build Cobalt
        run: |
          NINJA_STATUS="[%e sec | %f/%t %u remaining | %c/sec | j%r] "
          ninja -C out/android-${{ matrix.arch }}_gold cobalt_install

      - name: Upload APK to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: out/android-${{ matrix.arch }}_gold/cobalt.apk
          asset_name: cobalt-android-${{ matrix.arch }}.apk
          tag: ${{ github.ref_name }}
          overwrite: true
